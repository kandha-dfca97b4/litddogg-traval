name: Validate checklist

on:
  pull_request:
  push:
    branches: [main, feat/travel-checklist-v1]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required app files
        run: test -s index.html && test -s styles.css && test -s config.js && test -s supabase/schema.sql
